"a": `<h1>Finals Lab Exam - Set A: Inventory Tracker</h1>
<h2>Cloud Computing - Practical Exam</h2>
<hr>
<h2>Learning Outcomes</h2>
<table>
<tr><th>Level</th><th>What You'll Demonstrate</th></tr>
<tr><td><strong>Remember / Understand</strong></td><td>Identify and explain how S3, Lambda, and IAM policies connect</td></tr>
<tr><td><strong>Apply</strong></td><td>Set up S3 buckets, Lambda functions, IAM roles, and event triggers</td></tr>
<tr><td><strong>Analyze</strong></td><td>Read CloudWatch Logs to trace and fix application errors</td></tr>
</table>
<hr>
<h2>The Scenario</h2>
<p>A sari-sari store owner is tired of manually counting stock. They want a serverless system that updates a live dashboard whenever they upload their inventory CSV file.</p>
<hr>
<h2>What You Need To Do</h2>
<h3>1. Create S3 Bucket</h3>
<p>Create a bucket named <code>finals-&lt;your-student-id&gt;</code> in ap-southeast-1. Enable static website hosting with <code>index.html</code>. Disable Block Public Access and apply a proper public read bucket policy.</p>
<h3>2. Create Lambda Function</h3>
<p>Create a function named <code>ProcessCSV-&lt;your-student-id&gt;</code> using Python 3.12.</p>
<h3>3. Configure IAM and S3 Trigger</h3>
<p>Add an inline policy to the Lambda role for least-privilege access to your bucket. Do NOT use FullAccess policies. Set up an S3 event notification to trigger your Lambda.</p>
<h3>4. Debug the Application</h3>
